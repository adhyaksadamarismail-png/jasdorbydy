<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="50%" stop-color="#f8a5c2" />
      <stop offset="100%" stop-color="#e84393" />
    </linearGradient>
  </defs>

  <!-- Ribbons Bow on Top -->
  <g transform="translate(100, 18) scale(0.9)">
    <!-- Bow Loops -->
    <path d="M 0 0 C -25 -20, -35 10, 0 0 Z" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
    <path d="M 0 0 C 25 -20, 35 10, 0 0 Z" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
    <path d="M -22 -10 C -12 -5, -8 0, 0 0 C -8 0, -12 -5, -22 -10 Z" fill="#ff9ff3" />
    <path d="M 22 -10 C 12 -5, 8 0, 0 0 C 8 0, 12 -5, 22 -10 Z" fill="#ff9ff3" />
    <!-- Ribbon Tails -->
    <path d="M -3 0 L -12 18 L -3 15 L 0 0 Z" fill="#d63031" />
    <path d="M 3 0 L 12 18 L 3 15 L 0 0 Z" fill="#d63031" />
    <!-- Bow Knot Center -->
    <circle cx="0" cy="0" r="6" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
  </g>

  <!-- Outer Circle Border with Dashed Stitching look -->
  <circle cx="100" cy="115" r="88" fill="#ffffff" stroke="#ffb6c1" stroke-width="3" />
  <circle cx="100" cy="115" r="82" fill="none" stroke="#f8a5c2" stroke-width="1.5" stroke-dasharray="4,3" />
  
  <!-- Inner Avatar Graphic -->
  <circle cx="100" cy="115" r="76" fill="url(#avatarBg)" />

  <!-- Chibi Avatar Face -->
  <path d="M 65 95 Q 100 65 135 95 Q 148 125 138 148 Q 130 135 120 130 Q 100 125 80 130 Q 70 135 62 148 Q 52 125 65 95 Z" fill="#ff7675" />
  <ellipse cx="100" cy="112" rx="30" ry="26" fill="#ffeaa7" />
  <path d="M 72 100 Q 88 112 100 102 Q 112 112 128 100 Q 120 88 100 86 Q 80 88 72 100 Z" fill="#d63031" />
  <!-- Cute Eyes -->
  <ellipse cx="90" cy="112" rx="3.5" ry="5.5" fill="#2d3436" />
  <ellipse cx="110" cy="112" rx="3.5" ry="5.5" fill="#2d3436" />
  <circle cx="91.5" cy="110" r="1.5" fill="#fff" />
  <circle cx="111.5" cy="110" r="1.5" fill="#fff" />
  <!-- Blush -->
  <ellipse cx="83" cy="119" rx="5" ry="2.5" fill="#ff7675" opacity="0.7" />
  <ellipse cx="117" cy="119" rx="5" ry="2.5" fill="#ff7675" opacity="0.7" />
  <!-- Smile -->
  <path d="M 96 119 Q 100 123 104 119" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round" />

  <!-- Logo Text -->
  <rect x="35" y="145" width="130" height="26" rx="13" fill="#e84393" stroke="#ffffff" stroke-width="1.5" />
  <text x="100" y="162" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">LOGO KAMU</text>
</svg>
