<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="pinkCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="100%" stop-color="#f8a5c2" />
    </linearGradient>
    <linearGradient id="lidGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffeaa7" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Sparkles background -->
  <path d="M 20 40 L 22 45 L 27 47 L 22 49 L 20 54 L 18 49 L 13 47 L 18 45 Z" fill="#ff7675" opacity="0.6" />
  <path d="M 140 30 L 141.5 34 L 145.5 35.5 L 141.5 37 L 140 41 L 138.5 37 L 134.5 35.5 L 138.5 34 Z" fill="#ff7675" opacity="0.6" />
  <path d="M 148 110 L 149 113 L 152 114 L 149 115 L 148 118 L 147 115 L 144 114 L 147 113 Z" fill="#e84393" opacity="0.6" />

  <!-- Cup Shadow -->
  <ellipse cx="80" cy="188" rx="45" ry="8" fill="#e84393" opacity="0.15" />

  <!-- Cup Base -->
  <path d="M 40 55 L 48 175 Q 80 185 112 175 L 120 55 Z" fill="url(#pinkCup)" stroke="#e84393" stroke-width="2" />
  <path d="M 42 58 L 49 173 Q 80 182 111 173 L 118 58 Z" fill="#fff0f5" opacity="0.3" />

  <!-- Drink Liquid & Ice Cubes in Transparent Top Lid -->
  <!-- Dome Lid -->
  <path d="M 36 55 C 36 30, 124 30, 124 55 Z" fill="url(#lidGlass)" stroke="#e84393" stroke-width="2" />
  <ellipse cx="80" cy="55" rx="44" ry="8" fill="#ffffff" stroke="#e84393" stroke-width="1.5" />

  <!-- Ice Cubes inside dome -->
  <rect x="52" y="36" width="16" height="12" rx="3" fill="#ffffff" opacity="0.85" stroke="#e84393" stroke-width="1" transform="rotate(-10, 60, 42)" />
  <rect x="74" y="34" width="18" height="12" rx="3" fill="#ffffff" opacity="0.85" stroke="#e84393" stroke-width="1" transform="rotate(8, 83, 40)" />
  <rect x="94" y="38" width="14" height="11" rx="3" fill="#ffffff" opacity="0.85" stroke="#e84393" stroke-width="1" transform="rotate(-15, 101, 43)" />

  <!-- Straw -->
  <path d="M 75 10 L 85 40" stroke="#e84393" stroke-width="5" stroke-linecap="round" />

  <!-- Cup Branding Text & Heart -->
  <g transform="translate(80, 115) rotate(-6)">
    <text x="0" y="-8" font-family="'Georgia', serif" font-weight="bold" font-size="16" font-style="italic" fill="#2d3436" text-anchor="middle">kopi</text>
    <text x="-4" y="10" font-family="'Georgia', serif" font-weight="bold" font-size="15" font-style="italic" fill="#2d3436" text-anchor="middle">kenangan</text>
    <!-- Heart icon -->
    <path d="M 32 4 C 32 0, 36 -2, 38 1 C 40 -2, 44 0, 44 4 C 44 9, 38 13, 38 14 C 38 14, 32 9, 32 4 Z" fill="#d63031" />
  </g>
</svg>
