<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bearShade" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffeaa7" />
    </radialGradient>
  </defs>

  <!-- Bear Ears -->
  <circle cx="50" cy="42" r="16" fill="#ffffff" stroke="#ffb6c1" stroke-width="2" />
  <circle cx="50" cy="42" r="9" fill="#ff7675" opacity="0.5" />
  
  <circle cx="110" cy="42" r="16" fill="#ffffff" stroke="#ffb6c1" stroke-width="2" />
  <circle cx="110" cy="42" r="9" fill="#ff7675" opacity="0.5" />

  <!-- Pink Bow on Ear -->
  <g transform="translate(116, 32) scale(0.6)">
    <path d="M 0 0 C -20 -15, -25 10, 0 0 Z" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
    <path d="M 0 0 C 20 -15, 25 10, 0 0 Z" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
  </g>

  <!-- Bear Head -->
  <circle cx="80" cy="65" r="38" fill="#ffffff" stroke="#ffb6c1" stroke-width="2" />

  <!-- Eyes -->
  <ellipse cx="68" cy="62" rx="3.5" ry="5" fill="#2d3436" />
  <ellipse cx="92" cy="62" rx="3.5" ry="5" fill="#2d3436" />
  <circle cx="69" cy="60" r="1.5" fill="#ffffff" />
  <circle cx="93" cy="60" r="1.5" fill="#ffffff" />

  <!-- Muzzle & Nose -->
  <ellipse cx="80" cy="70" rx="9" ry="7" fill="#fff0f5" />
  <ellipse cx="80" cy="67" rx="3.5" ry="2.5" fill="#2d3436" />
  <path d="M 77 71 Q 80 74 83 71" fill="none" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cheeks Blush -->
  <ellipse cx="60" cy="69" rx="6" ry="3.5" fill="#ff7675" opacity="0.6" />
  <ellipse cx="100" cy="69" rx="6" ry="3.5" fill="#ff7675" opacity="0.6" />

  <!-- Bear Body -->
  <path d="M 52 92 Q 80 84 108 92 Q 120 135 80 142 Q 40 135 52 92 Z" fill="#ffffff" stroke="#ffb6c1" stroke-width="2" />

  <!-- Paws holding mini coffee cup -->
  <ellipse cx="62" cy="110" rx="9" ry="7" fill="#ffffff" stroke="#ffb6c1" stroke-width="1.5" />
  <ellipse cx="98" cy="110" rx="9" ry="7" fill="#ffffff" stroke="#ffb6c1" stroke-width="1.5" />

  <!-- Mini Coffee Cup held in paws -->
  <g transform="translate(80, 115) scale(0.65)">
    <rect x="-16" y="-20" width="32" height="40" rx="6" fill="#ff7675" stroke="#d63031" stroke-width="2" />
    <ellipse cx="0" cy="-20" rx="16" ry="4" fill="#ffffff" stroke="#d63031" stroke-width="1.5" />
    <line x1="4" y1="-32" x2="-2" y2="-20" stroke="#e84393" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Bear Logo on mini cup -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#ff7675" />
  </g>
</svg>
