      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="100%" stop-color="#f8a5c2" />
    </linearGradient>
  </defs>

  <!-- Sparkles -->
  <path d="M 22 35 L 24 40 L 29 42 L 24 44 L 22 49 L 20 44 L 15 42 L 20 40 Z" fill="#20bf6b" opacity="0.6" />
  <path d="M 140 100 L 141.5 104 L 145.5 105.5 L 141.5 107 L 140 111 L 138.5 107 L 134.5 105.5 L 138.5 104 Z" fill="#e84393" opacity="0.6" />

