    <path d="M -16 -20 L -16 -32 L -7 -25 L 7 -25 L 16 -32 L 16 -20 Q 16 -5 0 0 Q -16 -5 -16 -20 Z" fill="none" stroke="#2d3436" stroke-width="2" />
